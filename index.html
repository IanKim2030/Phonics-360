<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>찰떡이 파닉스 듣기</title><style>body{font-family:system-ui,sans-serif;max-width:540px;margin:5vh auto;padding:20px;background:#f5f8fc;color:#24334a}main{background:white;border-radius:18px;padding:26px;box-shadow:0 3px 18px #dce3eb}h1{font-size:20px}.word{font-size:58px;font-weight:750;text-align:center;margin:22px 0;color:#1e5f9d}.pattern{text-align:center;color:#64748b}button{font-size:20px;border:0;background:#1e5f9d;color:white;border-radius:12px;padding:16px;width:100%;cursor:pointer}audio{width:100%;margin:18px 0}p{line-height:1.6}</style></head><body><main><h1>🔊 찰떡이 파닉스</h1><div class="pattern" id="pattern"></div><div class="word" id="word"></div><p>파닉스 조합 소리 → 잠깐 쉬기 → 단어 전체 발음</p><audio id="player" controls preload="none"></audio><button id="play">▶ 소리 듣기</button><p style="font-size:13px;color:#64748b">버튼을 누르면 재생됩니다. 인터넷 연결이 필요합니다.</p></main><script>fetch('cards.json').then(r=>r.json()).then(cards=>{let n=Number(new URLSearchParams(location.search).get('id'));let c=cards[n-1];if(!c||c.id!==n){document.querySelector('main').textContent='카드 번호를 확인해 주세요.';return}document.getElementById('pattern').textContent=c.pattern;document.getElementById('word').textContent=c.word;let a=document.getElementById('player');a.src='audio/'+String(n).padStart(3,'0')+'.mp3';document.getElementById('play').onclick=()=>{a.currentTime=0;a.play()};});</script></body></html>
