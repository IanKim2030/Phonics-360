<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>찰떡이 파닉스 듣기</title><style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:4vh auto;padding:16px;background:#f5f8fc;color:#24334a}main{background:white;border-radius:18px;padding:24px;box-shadow:0 3px 18px #dce3eb}h1{font-size:21px}.word{font-size:56px;font-weight:750;text-align:center;margin:18px 0;color:#1e5f9d}.pattern{text-align:center;color:#64748b;font-size:19px}.small{font-size:13px;color:#64748b}button{font-size:17px;border:0;background:#1e5f9d;color:white;border-radius:10px;padding:13px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f59e0b}audio{width:100%;margin:12px 0}.row{display:flex;gap:8px;margin:10px 0}.row button{flex:1}.settings{background:#f1f5f9;padding:14px;border-radius:12px;margin-top:16px}.fields{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.fields label{flex:1;min-width:95px;font-size:14px}.fields input,.fields select{box-sizing:border-box;display:block;width:100%;padding:10px;font-size:16px;border:1px solid #cbd5e1;border-radius:8px;margin-top:5px}#status{min-height:22px;text-align:center;font-size:14px}#cardNo{text-align:center;color:#64748b}
</style></head><body><main><h1>🔊 찰떡이 파닉스</h1><div id="cardNo"></div><div class="pattern" id="pattern"></div><div class="word" id="word"></div><p class="small">파닉스 조합 소리 → 잠깐 쉬기 → 단어 전체 발음</p><audio id="player" controls preload="none"></audio><div class="row"><button id="prev">◀ 이전 카드</button><button id="next">다음 카드 ▶</button></div><div class="row"><button id="play">▶ 1회 듣기</button><button id="repeat3">3회 반복</button><button id="repeat5">5회 반복</button></div><section class="settings"><strong>📚 연속 학습</strong><div class="fields"><label>시작 카드<input id="start" type="number" min="1" max="360" value="1"></label><label>끝 카드<input id="end" type="number" min="1" max="360" value="12"></label><label>카드별 반복<select id="per"><option value="1">1회</option><option value="3" selected>3회</option><option value="5">5회</option></select></label></div><label><input id="loop" type="checkbox" checked> 끝 카드 다음 시작 카드로 돌아가기 (무한 반복)</label><div class="row"><button id="sequence">▶ 연속 재생 시작</button><button id="stop" style="background:#64748b">■ 중지</button></div></section><p id="status" aria-live="polite"></p><p class="small">QR코드로 들어온 카드부터 볼 수 있습니다. 연속 재생은 시작·끝 카드 범위를 선택하세요. 인터넷 연결이 필요합니다.</p></main>
<script>
fetch('cards.json').then(r=>{if(!r.ok)throw Error('카드 목록을 가져올 수 없습니다');return r.json()}).then(cards=>{
const $=id=>document.getElementById(id),audio=$('player'),status=$('status');const params=new URLSearchParams(location.search);let n=Number(params.get('id')||1),mode='idle',per=1,played=0,first=1,last=12,loop=false,token=0;
if(!Number.isInteger(n)||n<1||n>cards.length)n=1;
$('start').max=$('end').max=cards.length;$('end').value=Math.min(12,cards.length);
function show(num){if(num<1||num>cards.length)return;n=num;const c=cards[n-1];$('pattern').textContent=c.pattern;$('word').textContent=c.word;$('cardNo').textContent='카드 '+n+' / '+cards.length;audio.src='audio/'+String(n).padStart(3,'0')+'.mp3';history.replaceState(null,'',location.pathname+'?id='+n); }
function halt(){token++;mode='idle';audio.pause();audio.currentTime=0}
function play(){const t=++token;audio.currentTime=0;audio.play().catch(()=>{if(t===token){mode='idle';status.textContent='재생할 수 없습니다. 재생 버튼을 다시 눌러 주세요.'}})}
function single(times){halt();mode='single';per=times;played=0;status.textContent='현재 카드 '+times+'회 재생';play()}
function sequence(){const a=Number($('start').value),b=Number($('end').value);if(!Number.isInteger(a)||!Number.isInteger(b)||a<1||b>cards.length||a>b){status.textContent='시작·끝 카드 번호를 확인해 주세요.';return}halt();first=a;last=b;per=Number($('per').value);loop=$('loop').checked;played=0;mode='sequence';show(first);status.textContent=first+'~'+last+'번 연속 학습 중';play()}
$('play').onclick=()=>single(1);$('repeat3').onclick=()=>single(3);$('repeat5').onclick=()=>single(5);$('sequence').onclick=sequence;
$('stop').onclick=()=>{halt();status.textContent='재생 중지됨'};
$('prev').onclick=()=>{halt();show(Math.max(1,n-1));status.textContent='카드 '+n};
$('next').onclick=()=>{halt();show(Math.min(cards.length,n+1));status.textContent='카드 '+n};
audio.addEventListener('ended',()=>{if(mode==='idle')return;played++;if(played<per){status.textContent=n+'번 카드 '+(played+1)+' / '+per+'회 재생 중';play();return}if(mode==='single'){mode='idle';status.textContent=n+'번 카드 '+per+'회 완료';return}played=0;if(n<last){show(n+1)}else if(loop){show(first)}else{mode='idle';status.textContent=first+'~'+last+'번 학습 완료';return}status.textContent=n+'번 카드 1 / '+per+'회 재생 중';play()});
show(n);
}).catch(e=>{document.getElementById('status').textContent=e.message});
</script></body></html>
